[project]
name = "openscad-packer"
dynamic = ["version"]
description = "Pack OpenSCAD includes into an efficient single file."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{name = "Torgny Bjers", email = "torgny.bjers@gmail.com"}]
license-files = ["LICENSE"]
keywords = [
    "openscad",
    "packer",
    "minify",
    "inline",
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",

    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",

    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "openscad-parser>=1.0.1",
    "click>=8.0",
]

[project.urls]
Repository = "https://github.com/NascentMaker/OpenSCAD-Packer"

[project.scripts]
openscad-packer = "openscad_packer.cli:cli"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "coverage[toml]>=7.0"]

[tool.pytest.ini_options]
addopts = "--cov=openscad_packer --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["openscad_packer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
