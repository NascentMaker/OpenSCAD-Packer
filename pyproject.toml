[project]
name = "openscad-packer"
version = "2026.6.1"
description = "Pack OpenSCAD includes into an efficient single file."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "openscad-parser>=1.0.1",
    "click>=8.0",
]

[project.scripts]
openscad-packer = "openscad_packer.cli:cli"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "coverage[toml]>=7.0"]

[tool.pytest.ini_options]
addopts = "--cov=openscad_packer --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["openscad_packer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
